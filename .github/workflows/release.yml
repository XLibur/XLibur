name: Release

# All packages version in lockstep from the core tag, so one tag releases the
# whole set: XLibur, XLibur.Bundle, and the three font engine packages.
#
# The report packages are NOT in this set — they are on their own version stream
# off `report-v*` tags. See release-report.yml and XLibur.Report.props.
#
# The glob requires a digit after the `v` so it matches only the core version
# stream. A bare `v*` would also match a prefixed tag from an independently
# versioned package (`viz-v1.0.0`), firing a full core release off it.
on:
  push:
    tags: ['v[0-9]*']
  # Called by release-publish.yml, which creates the tag and then invokes this
  # workflow directly. A tag pushed with GITHUB_TOKEN does not trigger the
  # `push: tags` trigger above, so the call has to be explicit.
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Read as an MSBuild property, so every pack below embeds its SPDX manifest.
      # Off by default (Directory.Build.targets) so PR builds do not pay for it.
      GenerateSBOM: true

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      # Captured before publishing, because once this release is published it
      # becomes "latest" and can no longer serve as the previous tag.
      # Filtered to the core version stream: an independently versioned package's
      # release (`report-v0.1.0`) must never become the tag core's notes diff
      # against, the same reason the tag glob above requires a digit after the `v`.
      - name: Resolve previous release tag
        id: previous
        run: |
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
                   --limit 20 --json tagName --jq '[.[] | select(.tagName | test("^v[0-9]"))] | .[0].tagName // ""')
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
          echo "Previous release tag: ${prev:-<none>}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore XLibur.slnx

      # CycloneDX, pinned in .config/dotnet-tools.json so Dependabot keeps it current.
      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build XLibur.slnx --configuration Release --no-restore

      - name: Pack
        run: |
          for project in XLibur XLibur.Fonts.SixLabors.V1 XLibur.Bundle XLibur.Fonts.SixLabors XLibur.Fonts.SkiaSharp; do
            echo "::group::Pack $project"
            dotnet pack "$project/$project.csproj" --configuration Release --no-build --output ./artifacts
            echo "::endgroup::"
          done
          ls -la ./artifacts/

      # Every package must carry the tag's version. A mismatch means MinVer did
      # not see the tag, which would publish a prerelease-versioned package and
      # leave XLibur.Bundle depending on a version that was never released.
      - name: Verify package versions match the tag
        run: |
          expected=${TAG#v}
          status=0
          for package in ./artifacts/*.nupkg; do
            name=$(basename "$package" .nupkg)
            if [ "${name%.$expected}" = "$name" ]; then
              echo "::error::$name is not version $expected"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::Package versions do not match tag $TAG — refusing to publish"
            exit 1
          fi
          echo "All packages are version $expected"

      # One CycloneDX document per package, attached to the release beside the .nupkg it
      # describes. This is in addition to the SPDX manifest already embedded in each
      # package by GenerateSBOM above — that one travels to nuget.org consumers, this one
      # resolves the ProjectReference graph and is the better document for tooling.
      #
      # The project list matches Pack above; the version is the tag's, already verified
      # against every package by the step above.
      - name: Generate SBOMs
        run: |
          bash .github/scripts/generate-sbom.sh "${TAG#v}" ./sboms \
            XLibur XLibur.Fonts.SixLabors.V1 XLibur.Bundle XLibur.Fonts.SixLabors XLibur.Fonts.SkiaSharp

      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: jafin

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Push symbols to NuGet
        run: dotnet nuget push ./artifacts/*.snupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      # Publishes the rolling draft that Release Drafter has been accumulating
      # from merged PRs, so any manual edits made to it are kept.
      - name: Publish GitHub Release
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          publish: true
          tag: ${{ env.TAG }}
          name: ${{ env.TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Release Drafter has no first-time-contributor detection, so borrow
      # GitHub's own and append its "New Contributors" section to the notes.
      - name: Append new contributors
        run: |
          prev='${{ steps.previous.outputs.tag }}'
          if [ -n "$prev" ]; then
            generated=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" -f previous_tag_name="$prev" --jq .body)
          else
            generated=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body)
          fi

          printf '%s\n' "$generated" | awk '/^## New Contributors/ { found = 1 } found { print }' > new-contributors.md

          if [ ! -s new-contributors.md ]; then
            echo "No new contributors in this release."
            exit 0
          fi

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          printf '\n' >> notes.md
          cat new-contributors.md >> notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          echo "Appended:"
          cat new-contributors.md

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
            ./sboms/*.cdx.json
