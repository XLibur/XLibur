name: Mutation Testing

on:
  schedule:
    - cron: '0 4 * * *'  # Daily at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # stryker-config.json pins target-framework to net10.0, so the 8.0 SDK is never used.
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      # Only the project under mutation and its test project matter here; restoring the whole
      # solution pulls in six other test projects, the benchmarks and the examples for nothing.
      - name: Restore dependencies
        run: dotnet restore XLibur.Tests/XLibur.Tests.csproj

      # Stryker builds the project itself before mutating it, so a build step here is duplicated
      # work. It also built Release, where GeneratePackageOnBuild is on for the seven packable
      # projects, so every run packed (and SBOM-scanned) NuGet packages nothing consumed.
      # Stryker's own build runs at the default Debug configuration and packs nothing.
      # - name: Build
      #   run: dotnet build XLibur.slnx --configuration Release --no-restore

      - name: Run Stryker
        env:
          StrykerEnabled: 'true'
        run: dotnet stryker -f stryker-config.json

      - name: Upload mutation report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stryker-report
          path: StrykerOutput/**/reports/
          retention-days: 30
