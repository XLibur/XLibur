name: Release Report

# The report packages release on their own version stream, not core's, so a report
# release needs no core release and a core release does not renumber the report
# packages. MinVer reads `report-v0.1.0`-style tags for these two projects (see
# XLibur.Report.props); core reads `v0.106.0`-style ones.
#
#   git tag -a report-v0.1.0 -m "XLibur.Report 0.1.0"
#   git push upstream report-v0.1.0
#
# Or dispatch from main with a version, as Publish Release does for core: the run
# rolls the "XLibur.Report — Unreleased" section of CHANGELOG.md into a dated
# version heading, commits it, and tags that commit report-v<version> before it
# builds, so MinVer produces that version. The commit and tag are pushed only once
# every check below has passed. A dry run shows the changelog diff and pushes
# nothing. If a run fails after the push, dispatch the same version again: it
# resumes from the tag and finishes the NuGet push and the GitHub Release.
#
# Run with dry-run first (workflow_dispatch) to see the versions and the declared
# core dependency without publishing anything.
#
# Without a version, a dispatch with dry-run off will publish only from a commit
# that is exactly a report-v tag — anywhere else MinVer yields a pre-release and
# the run refuses, because a NuGet version cannot be reused.

on:
  push:
    tags: ['report-v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.300.0. Leave empty to use the report-v tag on the commit.'
        required: false
        type: string
      dry-run:
        description: 'Dry run — build, pack and check, but do not publish'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  release:
    name: Release report packages
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    env:
      # A dispatch run is a dry run unless explicitly told otherwise; a tag push
      # is the real thing.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run != false }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Read as an MSBuild property, so every pack below embeds its SPDX manifest.
      # Off by default (Directory.Build.targets) so PR builds do not pay for it.
      GenerateSBOM: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Before the build, so MinVer reads the new tag. The input is passed through
      # the environment, never interpolated into the script — a workflow_dispatch
      # input is attacker-controlled text.
      - name: Tag the requested version
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::A versioned report release must run from main (got $GITHUB_REF_NAME)"
            exit 1
          fi

          version="${INPUT_VERSION#report-}"
          version="${version#v}"

          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$version' is not a stable MAJOR.MINOR.PATCH version"
            exit 1
          fi

          tag="report-v$version"
          latest=$(git tag --list 'report-v[0-9]*' --sort=-v:refname | head -n1)

          # The tag is pushed before the NuGet push and the GitHub Release, so a
          # run that fails in either leaves the tag behind with the release half
          # done. Re-running with the same version resumes it from the tag: both
          # NuGet pushes skip a version already there, and the release step
          # updates a release that exists. Only the latest tag can resume — an
          # older one is a typo, and rebuilding it would replace its assets.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if [ "$tag" != "$latest" ]; then
              echo "::error::Tag $tag already exists and is not the latest report tag ($latest)"
              exit 1
            fi

            # Released means a published GitHub Release carrying both packages,
            # since the release is the last thing a run creates.
            assets=$(gh release view "$tag" --json isDraft,assets \
              --jq 'select(.isDraft | not) | .assets[].name' 2>/dev/null || true)
            if grep -qxF "XLibur.Report.$version.nupkg" <<<"$assets" && \
               grep -qxF "XLibur.Report.DynamicLinq.$version.nupkg" <<<"$assets"; then
              echo "::error::$tag is already released"
              exit 1
            fi

            echo "::notice::$tag exists but its release is incomplete — resuming from the tag"
            git checkout --quiet "$tag"
            echo "REQUESTED_TAG=$tag" >> "$GITHUB_ENV"
            echo "RESUMING=true" >> "$GITHUB_ENV"
            exit 0
          fi

          # NuGet versions cannot be reused, so refuse anything that is not an
          # increase over the highest report tag.
          if [ -n "$latest" ] && \
             [ "$(printf '%s\n%s\n' "$version" "${latest#report-v}" | sort -V | head -n1)" = "$version" ]; then
            echo "::error::$tag is not an increase over the latest tag $latest"
            exit 1
          fi

          # Roll the report section of the changelog, as Publish Release does for
          # core, and tag that commit — so the tag's commit holds its own notes.
          bash .github/scripts/roll-changelog.sh --report "$version"
          git --no-pager diff -- CHANGELOG.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m "chore: roll changelog for $tag"
          git tag -a "$tag" -m "XLibur.Report $version"
          echo "Tagged the changelog commit as $tag"
          echo "REQUESTED_TAG=$tag" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore XLibur.slnx

      # CycloneDX, pinned in .config/dotnet-tools.json so Dependabot keeps it current.
      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build XLibur.slnx --configuration Release --no-restore

      # The suite has to pass for the commit being released, not merely for the
      # commit the tag was cut from on someone's machine.
      - name: Test
        run: >
          dotnet test XLibur.Report.Tests/XLibur.Report.Tests.csproj
          --configuration Release
          --no-build
          --framework net10.0

      - name: Pack
        run: |
          for project in XLibur.Report XLibur.Report.DynamicLinq; do
            echo "::group::Pack $project"
            dotnet pack "$project/$project.csproj" --configuration Release --no-build --output ./artifacts
            echo "::endgroup::"
          done
          ls -la ./artifacts/

      # What was actually built, read from the packed files rather than assumed
      # from the ref — a dispatch run has no tag to read, and every later step
      # needs to agree on one version. The [0-9] glob picks XLibur.Report itself
      # rather than XLibur.Report.DynamicLinq, whose name also starts with it.
      - name: Resolve the released version
        run: |
          package=$(ls ./artifacts/XLibur.Report.[0-9]*.nupkg | head -n1)
          version=$(basename "$package" .nupkg)
          version="${version#XLibur.Report.}"

          status=0
          for package in ./artifacts/*.nupkg; do
            name=$(basename "$package" .nupkg)
            if [ "${name%.$version}" = "$name" ]; then
              echo "::error::$name is not version $version"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::The report packages do not share one version — refusing to publish"
            exit 1
          fi

          echo "All report packages are version $version"
          echo "REPORT_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=report-v$version" >> "$GITHUB_ENV"

      # A tag push must produce packages carrying that tag's version. A mismatch
      # means MinVer did not see the tag — usually a shallow clone or a tag that
      # does not match the report prefix — and would publish a pre-release version.
      # The same holds for a tag this run created from the version input.
      - name: Verify the version matches the tag
        if: startsWith(github.ref, 'refs/tags/') || env.REQUESTED_TAG != ''
        run: |
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          expected="${tag#report-v}"
          if [ "$REPORT_VERSION" != "$expected" ]; then
            echo "::error::Packages are version $REPORT_VERSION but tag $tag expects $expected — refusing to publish"
            exit 1
          fi
          echo "Version $REPORT_VERSION matches tag $tag"

      # The check above only runs on a tag, so a dispatch run with dry-run off
      # would otherwise publish whatever MinVer produced. On any commit that is
      # not exactly a report-v tag that is a pre-release like 0.200.1-alpha.0.4,
      # and a NuGet version can never be reused once pushed. Publishing is for
      # released versions; a dispatch that wants packages should stay a dry run.
      - name: Refuse to publish a pre-release version
        if: env.DRY_RUN != 'true'
        run: |
          case "$REPORT_VERSION" in
            *-*)
              echo "::error::$REPORT_VERSION is a pre-release, produced because HEAD is not exactly a report-v tag."
              echo "::error::Push a report-v tag to release, or re-run as a dry run to just build the packages."
              exit 1
              ;;
          esac
          echo "$REPORT_VERSION is a release version"

      # The gate that matters. XLibur.Report reads core internals through an
      # InternalsVisibleTo grant, so XLibur.Report.props declares an EXACT core
      # dependency rather than a floor — internals carry no compatibility contract.
      # An exact dependency on a core version that is not on NuGet is unresolvable,
      # so refuse to publish one. Once spec 13's public surface lands and the
      # dependency becomes an open floor, this check still holds: the floor version
      # has to exist.
      - name: Verify the declared core dependency is published
        run: |
          package=$(ls ./artifacts/XLibur.Report.[0-9]*.nupkg | head -n1)
          echo "Reading the declared dependency from $(basename "$package")"

          # The first XLibur dependency in the nuspec; every target framework group
          # carries the same one.
          declared=$(unzip -p "$package" 'XLibur.Report.nuspec' \
            | grep -o 'id="XLibur" version="[^"]*"' \
            | head -n1 \
            | sed 's/.*version="\([^"]*\)".*/\1/')

          if [ -z "$declared" ]; then
            echo "::error::Could not read the XLibur dependency from the packed nuspec"
            exit 1
          fi

          # Strip range brackets: [0.107.0] and 0.107.0 both resolve to 0.107.0.
          version=$(printf '%s' "$declared" | tr -d '[]()' | cut -d, -f1)
          echo "Declared core dependency: $declared (checking $version)"

          if ! curl -sf "https://api.nuget.org/v3-flatcontainer/xlibur/index.json" -o core-versions.json; then
            echo "::error::Could not query NuGet for published XLibur versions"
            exit 1
          fi

          if ! jq -e --arg v "$version" '.versions | index($v)' core-versions.json >/dev/null; then
            echo "::error::XLibur $version is not published on NuGet, so this package would be unresolvable."
            echo "::error::XLibur.Report declares an exact dependency on core internals; see XLibur.Report.props."
            echo "::error::Publish core $version first, or update XLiburDependencyVersion."
            exit 1
          fi

          echo "XLibur $version is published — dependency is resolvable"
          echo "CORE_DEPENDENCY=$declared" >> "$GITHUB_ENV"

      # One CycloneDX document per package, attached to the release beside the .nupkg
      # it describes. This is in addition to the SPDX manifest already embedded in each
      # package by GenerateSBOM above — that one travels to nuget.org consumers, this one
      # resolves the ProjectReference graph and is the better document for tooling.
      #
      # Runs after the gates above so a release that is going to be refused does not
      # spend the time, but before the summary, which lists what was produced.
      - name: Generate SBOMs
        run: bash .github/scripts/generate-sbom.sh "$REPORT_VERSION" ./sboms XLibur.Report XLibur.Report.DynamicLinq

      - name: Summary
        run: |
          {
            echo "### Report packages"
            echo
            if [ "$DRY_RUN" = "true" ]; then
              echo "**Dry run — nothing was published.**"
              echo
            fi
            if [ "${RESUMING:-}" = "true" ]; then
              echo "**Resumed an incomplete release from its existing tag.**"
              echo
            fi
            echo "Version: \`$REPORT_VERSION\` (release \`$RELEASE_TAG\`)"
            echo
            echo "Core dependency: \`XLibur $CORE_DEPENDENCY\`"
            echo
            for package in ./artifacts/*.nupkg; do
              echo "- \`$(basename "$package")\`"
            done
            echo
            echo "SBOMs: SPDX embedded in each package under \`_manifest/\`, plus CycloneDX"
            echo
            for sbom in ./sboms/*.cdx.json; do
              echo "- \`$(basename "$sbom")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Only now that every check has passed, so a refused run leaves neither the
      # changelog commit nor the tag behind. One atomic push, so main never gets
      # the rolled changelog without its tag: a retry would then find the
      # Unreleased section empty. If main moved during the run the push is
      # rejected, and nothing is tagged or published. A resumed run pushed both
      # the first time. The release step below finds the tag rather than making one.
      - name: Push the changelog commit and tag
        if: env.DRY_RUN != 'true' && env.REQUESTED_TAG != '' && env.RESUMING != 'true'
        run: git push --atomic origin HEAD:main "$REQUESTED_TAG"

      - name: NuGet login
        if: env.DRY_RUN != 'true'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: jafin

      - name: Push to NuGet
        if: env.DRY_RUN != 'true'
        run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Push symbols to NuGet
        if: env.DRY_RUN != 'true'
        run: dotnet nuget push ./artifacts/*.snupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      # Its own GitHub Release, on its own tag. Marked as a pre-release while the
      # stream is below 1.0 so it never becomes the "latest release" that core's
      # own release notes diff against.
      #
      # Keyed to the resolved version rather than to github.ref_name, so that a
      # dispatch run which publishes also releases. Gating this on refs/tags left
      # the two able to disagree: report-v0.200.0 was dispatched from main, pushed
      # both packages to NuGet, and skipped this step, so the version existed on
      # NuGet with no release beside it. Anything that reaches NuGet gets a
      # release, and target_commitish creates the tag when the run was not one.
      - name: Publish GitHub Release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ !startsWith(env.RELEASE_TAG, 'report-v1') }}
          generate_release_notes: true
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
            ./sboms/*.cdx.json

      # Includes the SBOMs so a dry run — which publishes nothing — still leaves them
      # somewhere inspectable.
      - name: Upload packages
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-packages
          path: |
            ./artifacts/*
            ./sboms/*
