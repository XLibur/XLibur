version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: SixLabors.Fonts
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      # SkiaSharp checks at load time that its native library matches the
      # managed version. Bumped apart, the font engine fails to load on Linux.
      skiasharp:
        patterns:
          - SkiaSharp
          - SkiaSharp.*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
