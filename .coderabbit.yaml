language: en-US

reviews:
  request_changes_workflow: false
  high_level_summary: true
  collapse_walkthrough: true
  poem: false
  # Off: auto reviews are disabled, so every PR otherwise got a "Review skipped" comment.
  review_status: false
  sequence_diagrams: true
  # Reviews are triggered manually by commenting `@coderabbitai review` on a PR.
  auto_review:
    enabled: false
    drafts: false
  # Markdown (the changelog, docs, READMEs) is not reviewed, so a PR that changes only Markdown
  # has nothing to review. Build and Test skips such a PR too (paths-ignore), and Greptile
  # ignores the same files (greptile.json).
  path_filters:
    - '!**/*.md'
    - '!**/*.trx'
    - '!**/BenchmarkDotNet.Artifacts/**'
    - '!**/obj/**'
    - '!**/bin/**'
    - '!**/PublicAPI.Shipped.txt'
    - '!**/PublicAPI.Unshipped.txt'
  path_instructions:
    - path: 'XLibur/**/*.cs'
      instructions: |
        This is the core library. Focus on:
        - Thread safety and concurrency issues
        - Memory allocations and performance
        - Nullable reference type correctness
        - Public API surface changes
    - path: 'XLibur.Tests/**/*.cs'
      instructions: |
        These are NUnit 4.x tests. Check for:
        - Proper assertions (prefer Assert.That constraint model)
        - Test isolation and determinism
        - Missing edge case coverage
    - path: 'XLibur.Benchmarks/**/*.cs'
      instructions: |
        These are BenchmarkDotNet performance benchmarks. Focus on:
        - Correct benchmark methodology (no side-effect elimination)
        - Appropriate [Benchmark] and [GlobalSetup] usage
        - Do not flag allocations or style in harness code

chat:
  auto_reply: true
